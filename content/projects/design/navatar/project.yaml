  description: |
    NAVATAR는 한국 20대를 위한 맞춤형 뉴스 소비 플랫폼입니다. 기존 뉴스 플랫폼은 빽빽한 글과 양극화된 콘텐츠로 젊은 독자를 지치게 합니다. NAVATAR는 LLM(Gemini, Claude)으로 기사를 다시 쓰고 쉽게 풀어 개인에게 맞춥니다. 토론 채팅, 타임라인 요약, 용어 풀이처럼 직관적인 형식으로 정보를 정리해 진입 장벽을 낮추고 비판적 사고를 돕습니다.
