  description: |
    울산은 도시철도가 없고 시내버스 배차간격 중앙값이 41분이라, 환승 하나를 놓치면 30분 넘게 기다리거나 택시를 타야 합니다. 그런데 기존 지도 앱은 처음 검색한 시점의 경로를 고정해 보여 주기 때문에, 버스가 늦거나 놓쳤을 때 계획을 다시 확인하고 경로를 다시 찾는 일이 모두 이용자에게 남습니다.

    U-BUS는 이동을 실시간으로 따라가다 계획이 틀어지기 전에 먼저 개입하는 교통 비서 에이전트입니다. 조기 하차, 우회 경로, 근처 카페에서 기다리기 같은 대안을 먼저 제안합니다. 이용자 7명 인터뷰와, 배포한 웹앱을 참여자 3명이 실제 이동에 사용한 현장 파일럿을 통해 **교통 에이전트가 언제, 어떻게 개입해야 하는지** 설계 방향을 도출했습니다.
