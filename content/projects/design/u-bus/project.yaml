description: |
  In Ulsan, a city with no urban rail where the median bus headway is 41 minutes, missing a single transfer can mean a 30-minute wait or a taxi ride. Yet existing map apps fix the route at the moment of search, leaving riders to re-check and re-plan on their own whenever a bus is late or missed.

  U-BUS is a transit assistant agent that follows the trip in real time and steps in before the plan breaks — suggesting an earlier stop, a detour route, or a nearby café to wait in. Through interviews with 7 riders and a field pilot in which 3 participants used the deployed web app on their real trips, we derived design directions for **when and how a transit agent should intervene**.

