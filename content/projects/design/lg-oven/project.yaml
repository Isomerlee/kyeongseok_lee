  description: |
    광파오븐은 '요리 초보'에게 프리미엄 요리 경험을 주는 것을 목표로 합니다. 하지만 조리 상태가 보이지 않고 조작이 복잡해 사용자는 통제감을 잃었습니다. 심층 인터뷰와 하이브리드 어피니티 다이어그램으로 사용자가 음식 상태를 볼 수 없고 자동 조리를 믿지 못한다는 점을 찾았습니다. 이를 해결하기 위해 오븐을 파노라마 디스플레이, ThinQ AI 어시스턴트, 핸들 인디케이터를 갖춘 **'지능형 요리 플랫폼'**으로 발전시켜, 조리 과정 내내 사용자를 자연스럽게 안내하도록 했습니다.
