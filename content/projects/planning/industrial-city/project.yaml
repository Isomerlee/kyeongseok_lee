  description: |
    울산 기반 서브컬처 브랜드 RUDIMENT가 울산의 정체성인 '산업도시'를 담아 로컬 언더그라운드 문화를 넓혀 가는 프로젝트입니다. 부산 클럽 Moment와 협업해 울산과 부산을 잇는 새로운 문화적 시너지를 만듭니다.

    'Industrial City' 시리즈는 AI 비주얼 아트와 DJ를 결합해 울산의 산업 이미지를 재해석하는 파티입니다. vol.3에서는 'Neo-Ulsan'을 주제로 Moment의 VJ들과 여러 하위 주제를 옴니버스로 엮는 AI 비주얼라이저가 협업해, 산업의 요소가 현대 예술로 바뀌는 순간을 공간 안에서 경험하게 했습니다.

    이 프로젝트로 지역 예술 커뮤니티의 성장을 돕고, 산업도시에서도 언더그라운드 문화가 꽃필 수 있음을 보여 줍니다.
