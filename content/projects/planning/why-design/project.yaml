    과학기술원(UNIST) 안의 디자인학과라 많은 사람이 우리가 왜 있고 무엇을 하는지 잘 모릅니다. 학과를 알리기 위해 전공 설명회 형식으로 "Why Design"을 열었습니다. 전공 수업 결과물 전시, 세미나, 다양한 참여형 활동으로 방문객이 과학과 결합한 디자인 교육의 가치를 이해할 수 있도록 했습니다.
