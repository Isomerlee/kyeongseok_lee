# 컨퍼런스(11/28)가 끝나면 "마트의 상품처럼 진열하고 … 자리입니다" 문단을 실제 결과로 고치기
description: |
  Reboot Nam-gu is NEWWAYS' project to make Nam-gu, Ulsan a neighborhood young people want to stay in. It flips the usual direction of local politics: instead of politicians making promises to voters, residents define the problems of their neighborhood and propose solutions that district council members turn into ordinances — a **"reverse ordinance."** The issues are the everyday conditions that decide whether young people stay: transportation, culture, jobs, and local business.

  Young residents in their 20s and 30s join as supporters called "Chamgyeon-dan" and work with all six members of the Nam-gu Council from October to December.

  As Partner PM for events, I run the project's two offline events: proposing the mood and spatial layout, coordinating venues, catering, and production vendors, managing the event budget, and leading on-site operations.

  **Supporters' Kick-off** · Oct 17, 2026 · BCD Café, Ulsan
  The supporters and the six council members met for the first time. After the council members' presentations and Q&A, the teams began their work.

  **Final Conference "Ulsan Nam-gu Politics Mart"** · Nov 28, 2026 · Nam-gu Office Auditorium
  Each team's policy proposals are displayed like products in a market and presented directly to the council members. I laid out the reception, policy booths, and team tables along a single aisle, and arranged the stage so the reversal is visible: residents propose, council members take notes.

