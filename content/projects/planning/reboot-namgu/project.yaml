  title: 리부트 남구
  subtitle: 뉴웨이즈 울산 남구 청년 정치 참여 프로젝트
  meta:
    유형: 시민 참여 프로젝트 (뉴웨이즈)
    역할: 파트너 PM (이벤트)
    기간: 2026.09 - 2026.12
  description: |
    리부트 남구는 울산 남구를 청년이 계속 살고 싶은 동네로 만들기 위한 뉴웨이즈의 프로젝트입니다. 정치인이 공약하고 유권자가 고르는 익숙한 구도를 뒤집어, 주민이 동네의 문제를 정의하고 해법을 제안하면 구의원이 이를 조례로 만드는 **'역조례'** 방식으로 진행합니다. 다루는 문제는 교통 · 문화 · 일자리 · 상권처럼 청년이 지역에 남을지를 가르는 생활 조건입니다.

    2030 청년들이 서포터즈 '참견단'으로 모여, 10월부터 12월까지 남구의회 의원 6명과 함께 정책 제안을 만들어 갑니다.

    파트너 PM(이벤트)으로서 프로젝트의 오프라인 행사 두 개를 맡아, 무드와 공간 구성 제안부터 장소 · 케이터링 · 제작물 업체 조율, 행사 예산 관리, 현장 운영까지 진행합니다.

    **참견단 발대식** · 2026년 10월 17일 · 울산 중구 BCD 카페
    참견단과 의원 6명이 처음 만나는 자리로, 의원들의 발표와 질의응답 뒤 조별 활동을 시작했습니다.

    **최종 컨퍼런스 '울산 남구 폴리틱스 마트'** · 2026년 11월 28일 · 울산 남구청 대강당
    조별로 만든 정책을 마트의 상품처럼 진열하고 의원들에게 직접 제안하는 자리입니다. 리셉션, 정책 부스, 조별 테이블을 한 줄 통로로 잇는 공간을 짰고, 무대는 '주민이 제안하고 의원이 받아 적는' 역전된 구도가 보이도록 구성했습니다.
