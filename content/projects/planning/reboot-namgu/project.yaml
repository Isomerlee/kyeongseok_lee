description: |
  Reboot Nam-gu is NEWWAYS' project to make Nam-gu, Ulsan a neighborhood young people want to stay in. It flips the usual direction of local politics: instead of politicians making promises to voters, residents define the problems of their neighborhood and propose solutions that district council members turn into ordinances — a **"reverse ordinance."**

  As Event PM, I plan and run the offline events where resident supporters ("Super Chamgyeon-dan") meet the six members of the Nam-gu Council, from the orientation to the final conference at the Nam-gu Office auditorium. The stage itself is designed to show the reversal: residents propose, council members take notes.

