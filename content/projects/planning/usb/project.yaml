description: |
  USB brought 215-SST (KIM HAN & BOJVCK) to Ulsan and Busan for a one-day street culture project.

  In the afternoon, **Ulsan Skateboard Basement** took over Awesome Q Skatepark in Ulsan with a flea market, a "Cash for Anything" trick battle, and DJ sets. At night, **Underground Scene Burrowing** continued the party at Club Nasub in Busan.

  November 7, 2026 · Ulsan 13:00–17:00 / Busan 22:00–04:00

