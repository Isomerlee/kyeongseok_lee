# 사실 근거: PROJ_With215/5차 (1026-1031)/Plan_상세기록.md, 정리 1109~/공식_게시물_캡션.md (11/22 정리)
description: |
  USB was a one-day street culture project that brought the Seoul-based performance duo 215-SST (KIM HAN & BOJVCK) to Ulsan and Busan. The daytime and nighttime events were named so that both share the initials USB.

  Ulsan has only one indoor skatepark, and the underground DJ scenes in Busan and Ulsan have been shrinking. Using the duo's visit as the occasion, I set out to bring local skaters and DJs from both cities together in one place.

  In the afternoon, **Ulsan Skateboard Basement** took over both basement floors of Awesome Q Skatepark. On B2, free skating and DJ sets ran alongside "Cash for Anything," where anyone could step up, show a trick, and win a prize on the spot, followed by a live set from 215-SST. B1 became a chill zone for drinks, T-shirt and deck tagging, and sticker bombing, and a flea market ran through the afternoon. Local skaters built a new box for the day.

  At night, **Underground Scene Burrowing** continued at Clubnasub in Busan, where 215-SST and six local DJs from Ulsan, Busan, and Gyeongnam played until 4 a.m., with two more DJs at Panoroom, the bar on the first floor of the same building.

  As Main Director, I handled planning, artist booking, venue rental, poster direction, promotion, on-site operations, and settlement, and played DJ sets in both cities.

  November 7, 2026 · Ulsan 13:00–17:00 / Busan 22:00–04:00

