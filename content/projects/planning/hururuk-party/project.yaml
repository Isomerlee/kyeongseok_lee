  description: |
    **RUDIMENT X Pepper Coffee Presents: HURURUK Party**

    울산의 카페 Pepper Coffee와 크루 RUDIMENT가 함께 만든 일요일입니다. 맛있는 음식, 라이프스타일 큐레이션, 좋은 음악을 한자리에 모았습니다.

    서울과 부산 언더그라운드 씬의 로컬 DJ들이 공간을 몸이 움직이는 음악으로 채웠습니다.

    5월 11일 Pepper Coffee에서 햇살, 사람, 소리, 음식, 물건이 모두 어우러진 가장 맛있는 일요일을 보냈습니다.
