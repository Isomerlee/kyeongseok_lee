  description: |
    "표류 (drift)"는 라이브 오디오비주얼 전자음악 공연입니다. 공연자는 모듈러 신시사이저로 완성된 곡을 무대 위에서 일부러 해체하고, 생성형 AI 시스템은 흩어진 오디오 신호를 즉시 감지해 끊임없이 생겨나고 사라지는 이미지로 실시간 시각화합니다. 반응이 빠르고 지연이 적은 구조로 아날로그 사운드와 생성형 AI 비주얼을 잇습니다.
